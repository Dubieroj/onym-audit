# Onym audit seat. Included from the foldy.io server block.
# Static documents are served by nginx straight from disk, byte-for-byte, so
# they stay available even if the daemon is down; only the two write
# endpoints reach onym-audit. No access logs: see privacy.md.
location = /audit {
    return 301 /audit/;
}
location ^~ /audit/ {
    access_log off;
    alias /var/lib/onym-audit/site/;
    index index.html;
    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/json json;
        text/plain md sig;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
    }
    default_type text/plain;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin * always;
    # Revalidate every file, so a new page never meets an old app.js.
    add_header Cache-Control no-cache always;
    # Scripts only from this site: a javascript: link from any document a
    # page renders cannot run, and no page can be framed.
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location ~ /\. { deny all; }
    # Discovery snapshots are re-signed by the server; never cache a stale one.
    location ^~ /audit/discovery/catalogs/ {
        access_log off;
        alias /var/lib/onym-audit/site/discovery/catalogs/;
        default_type application/json;
        add_header Cache-Control no-cache always;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /audit/status.json {
        access_log off;
        alias /var/lib/onym-audit/site/status.json;
        default_type application/json;
        add_header Cache-Control no-cache always;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
    }
}
# Hosted auditors and the studio API, served by onym-audit.
location ^~ /audit/a/ {
    access_log off;
    client_max_body_size 4m;
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:8787/a/;
}
location ^~ /audit/hub/api/ {
    access_log off;
    client_max_body_size 4m;
    proxy_read_timeout 240s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:8787/hub/api/;
}
location = /audit/orders {
    access_log off;
    client_max_body_size 64k;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8787/orders;
}
location = /audit/responses {
    access_log off;
    client_max_body_size 16k;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8787/responses;
}
